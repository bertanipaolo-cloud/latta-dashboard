<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>Atlante dei vini Latta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100..125,400..800;1,100..125,400..800&family=DM+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:#E2EAF4;color-scheme:light}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
:root{
  --ground:#E2EAF4;
  --ground-2:#FFFFFF;
  --panel:#FFFFFF;
  --land:#FFFFFF;
  --land-line:#A9BCD4;
  --ink:#0D1A2B;
  --ink-2:#3B4C63;
  --muted:#78899F;
  --line:#D6DFEA;
  --cobalt:#0B4F9E;
  --cobalt-dim:#9EBDE0;
  --bolla:#3FA3C4;
  --bianco:#C8A522;
  --macerato:#DB7B1B;
  --rosato:#DE6180;
  --rosso:#B4302A;
  --disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--disp);
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:2px}

.app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:18px;
  padding:12px 18px;border-bottom:1px solid var(--line);background:var(--ground-2);
  flex-wrap:wrap;row-gap:10px}
.mark{display:flex;flex-direction:column;line-height:.92;flex:0 0 auto}
.mark b{font-variation-settings:"wdth" 118,"wght" 800;font-style:italic;font-size:26px;letter-spacing:-.01em}
.mark span{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--muted);text-transform:uppercase;margin-top:4px}

.seg{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 18px;border-radius:999px;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:color .15s,background .15s}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:#fff;font-weight:500}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 10px;border-radius:999px;
  border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);--c:var(--muted);
  transition:border-color .15s,opacity .15s,box-shadow .15s;background:var(--ground-2)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.chip.b-bolla{--c:var(--bolla)} .chip.b-bianco{--c:var(--bianco)}
.chip.b-macerato{--c:var(--macerato)} .chip.b-rosato{--c:var(--rosato)}
.chip.b-rosso{--c:var(--rosso)}
.chip.b-mescita{--c:var(--cobalt)}
.chip.b-mescita .dot{border-radius:2px;transform:rotate(45deg)}

/* ---------- stage ---------- */
.stage{flex:1 1 auto;position:relative;min-height:0;display:flex}
.canvaswrap{flex:1 1 auto;position:relative;min-width:0}
svg.scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
svg.view{display:none}
svg.view.on{display:block}

/* map */
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sea-grid{stroke:#D2DDEC;stroke-width:.8;fill:none;vector-effect:non-scaling-stroke}
.leader{stroke:var(--cobalt-dim);stroke-width:1.1;vector-effect:non-scaling-stroke}
.pin circle.halo{fill:var(--cobalt);opacity:.16}
.pin circle.core{fill:var(--cobalt);stroke:var(--ground);stroke-width:2;vector-effect:non-scaling-stroke}
.pin text.n{font-family:var(--mono);font-size:11px;fill:#fff;font-weight:500;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin text.lbl{font-family:var(--disp);font-size:13px;font-weight:600;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--ground);stroke-width:3.5px;stroke-linejoin:round}
.pin text.sub{font-family:var(--mono);font-size:9.5px;fill:var(--muted);pointer-events:none;letter-spacing:.08em;paint-order:stroke;stroke:var(--ground);stroke-width:3px;stroke-linejoin:round}
.pin{cursor:pointer}
.pin.sel circle.core{fill:var(--ink)}
.pin.sel circle.halo{opacity:.3}
.pin.dim{opacity:.22}

/* plane */
.axis{stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke}
.grid{stroke:#D6E0ED;stroke-width:1;vector-effect:non-scaling-stroke}
.quad{font-family:var(--disp);font-style:italic;font-variation-settings:"wdth" 118,"wght" 800;
  font-size:34px;fill:#C6D4E6;letter-spacing:.02em}
.quadsub{font-family:var(--mono);font-size:10px;fill:#B6C7DD;letter-spacing:.16em}
.pole{font-family:var(--disp);font-style:italic;font-variation-settings:"wdth" 115,"wght" 800;font-size:19px;fill:var(--ink-2)}
.polesub{font-family:var(--mono);font-size:9.5px;fill:var(--muted);letter-spacing:.1em}
.node{cursor:pointer}
.node circle.r{stroke:var(--ground);stroke-width:1.8;vector-effect:non-scaling-stroke}
.node text{font-family:var(--disp);font-size:12px;font-weight:600;fill:var(--ink-2);pointer-events:none;
  paint-order:stroke;stroke:var(--ground);stroke-width:3.5px;stroke-linejoin:round}
.node.sel circle.r{stroke:var(--ink);stroke-width:2.6}
.node.sel text{fill:var(--ink);font-weight:700}
.node.dim{opacity:.2}
.node .ring{fill:none;stroke:currentColor;opacity:.35;vector-effect:non-scaling-stroke}

/* legend */
.legend{position:absolute;left:16px;bottom:14px;display:flex;flex-direction:column;gap:5px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  pointer-events:none;background:linear-gradient(90deg,var(--ground) 60%,transparent);padding:10px 40px 10px 0;border-radius:4px}
.legend b{font-family:var(--disp);font-size:10px;letter-spacing:.18em;color:var(--ink-2);font-weight:700}
.hint{position:absolute;right:16px;bottom:14px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#93A3B8;pointer-events:none}

/* ---------- detail panel ---------- */
.panel{flex:0 0 380px;width:380px;border-left:1px solid var(--line);background:var(--panel);box-shadow:-18px 0 42px rgba(13,26,43,.07);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
  position:absolute;right:0;top:0;bottom:0;z-index:5}
.panel.on{transform:none}
.panel .close{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:18px;color:var(--muted);
  line-height:1;padding:6px 8px;z-index:2}
.pbody{overflow-y:auto;padding:24px 24px 32px;flex:1 1 auto;-webkit-overflow-scrolling:touch}

.p-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;margin-bottom:12px}
.p-eyebrow .sw{width:10px;height:10px;border-radius:50%}
.p-name{font-style:italic;font-variation-settings:"wdth" 118,"wght" 800;font-size:31px;line-height:1.02;
  letter-spacing:-.015em;text-wrap:balance;margin:0 0 8px}
.p-prod{font-size:14px;font-weight:600;color:var(--cobalt);margin:0 0 2px}
.p-place{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.p-note{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:20px 0 0;
  border-left:2px solid var(--cobalt);padding-left:14px}

.specs{margin:22px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;
  border-top:1px solid var(--line);padding-top:18px}
.specs dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.specs dd{margin:0;font-size:13.5px;line-height:1.35;color:var(--ink)}

.meters{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:16px}
.meter .mrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.meter .track{position:relative;height:3px;background:var(--line);border-radius:2px}
.meter .track i{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
  border-radius:50%;background:var(--cobalt);box-shadow:0 0 0 4px rgba(11,79,158,.14)}
.meter .track u{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line);text-decoration:none}

.price{display:flex;align-items:baseline;gap:14px;margin-top:24px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.price .big{font-style:italic;font-variation-settings:"wdth" 118,"wght" 800;font-size:34px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.price .glass{font-family:var(--mono);font-size:12px;color:var(--cobalt);border:1px solid var(--cobalt-dim);
  border-radius:999px;padding:4px 11px;letter-spacing:.08em}
.price .fmt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  background:var(--cobalt);color:#fff;padding:3px 8px;border-radius:3px;margin-left:8px;vertical-align:middle;font-weight:500}

/* scheda produttore */
.p-desc{font-size:14px;line-height:1.55;color:var(--ink-2);margin:18px 0 0}
.p-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.p-facts span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--ground)}
.sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  margin:26px 0 2px;padding-top:16px;border-top:1px solid var(--line)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li button{display:grid;grid-template-columns:9px 1fr auto;align-items:start;column-gap:11px;row-gap:3px;
  width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line)}
.plist li button:hover .nm{color:var(--cobalt)}
.plist .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.plist .nm{font-size:14.5px;font-weight:700;line-height:1.2}
.plist .pr{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums;
  font-weight:500;padding-top:1px}
.plist .sub2{grid-column:2 / 4;font-family:var(--mono);font-size:10.5px;color:var(--muted);
  letter-spacing:.03em;line-height:1.35}

@media (max-width:900px){
  .panel{position:absolute;left:0;right:0;top:auto;bottom:0;width:auto;height:62vh;border-left:0;
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%)}
  .panel.on{transform:none}
  .chips{margin-left:0;width:100%}
  .legend{font-size:9px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="mark"><b>latta</b><span>fermenti e miscele</span></div>
    <div class="seg" role="group" aria-label="Vista">
      <button id="btnMap" aria-pressed="true">Mappa</button>
      <button id="btnPlane" aria-pressed="false">Piano</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="stage">
    <div class="canvaswrap">
      <svg class="scene view on" id="mapSvg" viewBox="230 258 1140 730" preserveAspectRatio="xMidYMid meet" aria-label="Mappa dei produttori"></svg>
      <svg class="scene view" id="planeSvg" viewBox="0 0 1340 1010" preserveAspectRatio="xMidYMid meet" aria-label="Piano dei vini"></svg>
      <div class="legend" id="legend"></div>
      <div class="hint" id="hint"></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite">
      <button class="close" id="close" aria-label="Chiudi">&#215;</button>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>
</div>

/* ---------- projection (equirectangular, parallelo standard 44°N) ---------- */
const K=Math.cos(44*Math.PI/180);
const px = lon => (lon+11.5)*(1600/((25.5+11.5)*K))*K;
const py = lat => (56.5-lat)*(1100/23);

const NS="http://www.w3.org/2000/svg";
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const fmt = n => "€"+String(n).replace(".",",");

const state={view:"map", off:new Set(), mescita:false, sel:null, selProd:null};
const byId=Object.fromEntries(VINI.map(v=>[v.id,v]));

const visible = v => !state.off.has(v.t) && (!state.mescita || v.g);

/* ---------- chips ---------- */
const chipsEl=document.getElementById("chips");
for(const [k,t] of Object.entries(TIPI)){
  const b=document.createElement("button");
  b.className="chip b-"+k; b.setAttribute("aria-pressed","true");
  b.innerHTML='<span class="dot"></span>'+t.label;
  b.onclick=()=>{ state.off.has(k)?state.off.delete(k):state.off.add(k);
    b.setAttribute("aria-pressed", String(!state.off.has(k))); refresh(); };
  chipsEl.appendChild(b);
}
{
  const b=document.createElement("button");
  b.className="chip b-mescita"; b.setAttribute("aria-pressed","false");
  b.innerHTML='<span class="dot"></span>Al bicchiere';
  b.onclick=()=>{ state.mescita=!state.mescita; b.setAttribute("aria-pressed",String(state.mescita)); refresh(); };
  chipsEl.appendChild(b);
}

/* ---------- MAP ---------- */
const mapSvg=document.getElementById("mapSvg");
{
  const g=el("g");
  for(let lon=-5;lon<=20;lon+=5){const l=el("line",{class:"sea-grid",x1:px(lon),x2:px(lon),y1:py(52),y2:py(35)});g.appendChild(l);}
  for(let lat=36;lat<=51;lat+=5){const l=el("line",{class:"sea-grid",x1:px(-6),x2:px(21),y1:py(lat),y2:py(lat)});g.appendChild(l);}
  mapSvg.appendChild(g);
  const gl=el("g");
  EUROPE.forEach(c=>gl.appendChild(el("path",{class:"land",d:c.d})));
  mapSvg.appendChild(gl);
}
const pinLayer=el("g"); mapSvg.appendChild(pinLayer);

/* fan out pins that land within 26px of each other */
const prodKeys=Object.keys(PROD);
const pos={};
prodKeys.forEach(k=>pos[k]={x:px(PROD[k].lon), y:py(PROD[k].lat)});
(function fan(){
  const clusters=[];
  prodKeys.forEach(k=>{
    let c=clusters.find(cl=>cl.some(o=>Math.hypot(pos[o].x-pos[k].x,pos[o].y-pos[k].y)<26));
    if(c) c.push(k); else clusters.push([k]);
  });
  clusters.filter(c=>c.length>1).forEach(c=>{
    const cx=c.reduce((s,k)=>s+pos[k].x,0)/c.length, cy=c.reduce((s,k)=>s+pos[k].y,0)/c.length;
    const R=20;
    c.forEach((k,i)=>{ const a=-Math.PI/2 + i*2*Math.PI/c.length;
      pos[k]={x:cx+R*Math.cos(a), y:cy+R*Math.sin(a), fan:{cx,cy}}; });
  });
})();

/* label side: push labels away from the map centre */
const pins={};
prodKeys.forEach(k=>{
  const P=PROD[k], p=pos[k];
  const wines=VINI.filter(v=>v.pr===k);
  const g=el("g",{class:"pin", tabindex:"0", role:"button"});
  g.setAttribute("aria-label", P.n);
  if(p.fan) g.appendChild(el("line",{class:"leader",x1:p.fan.cx,y1:p.fan.cy,x2:p.x,y2:p.y}));
  const r = wines.length>4 ? 17 : 11;
  g.appendChild(el("circle",{class:"halo",cx:p.x,cy:p.y,r:r+9}));
  g.appendChild(el("circle",{class:"core",cx:p.x,cy:p.y,r:r}));
  const n=el("text",{class:"n",x:p.x,y:p.y}); n.textContent=wines.length; g.appendChild(n);
  const t=el("text",{class:"lbl"}); t.textContent=P.n;
  const s=el("text",{class:"sub"}); s.textContent=(P.c+" · "+P.r).toUpperCase();
  g.appendChild(t); g.appendChild(s);
  const act=()=>{ state.selProd=k; state.sel=null; showProducer(k); refresh(); };
  g.addEventListener("click",act);
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});
  pinLayer.appendChild(g);
  pins[k]={g, wines, lbl:t, sub:s, r, p};
});

/* place producer labels so they never sit on top of each other or on a pin */
(function placePinLabels(){
  const boxes=[];
  prodKeys.forEach(k=>{const p=pos[k], r=pins[k].r; boxes.push([p.x-r-4,p.y-r-4,(r+4)*2,(r+4)*2]);});
  const hit=(b)=>boxes.some(o=>!(b[0]+b[2]<o[0]||b[0]>o[0]+o[2]||b[1]+b[3]<o[1]||b[1]>o[1]+o[3]));
  const order=prodKeys.slice().sort((a,b)=>pins[b].wines.length-pins[a].wines.length);
  order.forEach(k=>{
    const {lbl,sub,r,p}=pins[k];
    const w=Math.max(lbl.getComputedTextLength(), sub.getComputedTextLength())+6;
    const cands=[
      ["start", r+11, 0],["end", -(r+11), 0],
      ["middle", 0, -(r+24)],["middle", 0, r+30],
      ["start", r+11, -30],["end", -(r+11), -30],
      ["start", r+11, 30],["end", -(r+11), 30],
      ["start", r+11, -58],["end", -(r+11), 58]
    ];
    let c=null;
    for(const cand of cands){
      const x=p.x+cand[1], y=p.y+cand[2];
      const bx = cand[0]==="start" ? x : cand[0]==="end" ? x-w : x-w/2;
      const b=[bx, y-13, w, 29];
      if(bx < 222 || bx+w > 1378) continue;
      if(!hit(b)){ c=cand; boxes.push(b); break; }
    }
    if(!c) c = p.x > 800 ? ["end", -(r+11), 0] : ["start", r+11, 0];
    const x=p.x+c[1], y=p.y+c[2];
    lbl.setAttribute("x",x); lbl.setAttribute("y",y-1); lbl.setAttribute("text-anchor",c[0]);
    sub.setAttribute("x",x); sub.setAttribute("y",y+13); sub.setAttribute("text-anchor",c[0]);
  });
})();

/* ---------- PLANE ---------- */
const planeSvg=document.getElementById("planeSvg");
const L=262, T=92, S=816;               /* riquadro del piano */
const qx = x => L + (x+1)/2*S;
const qy = y => T + (1-y)/2*S;
{
  const g=el("g");
  for(let i=1;i<4;i++){
    g.appendChild(el("line",{class:"grid",x1:L+i*S/4,x2:L+i*S/4,y1:T,y2:T+S}));
    g.appendChild(el("line",{class:"grid",x1:L,x2:L+S,y1:T+i*S/4,y2:T+i*S/4}));
  }
  const quads=[
    [qx(-.6),qy(.72),"VETRO","tesi e leggibili"],
    [qx(.6),qy(.72),"VELLUTO","morbidi e diretti"],
    [qx(-.62),qy(-.74),"SCINTILLA","nervosi e vivi"],
    [qx(.62),qy(-.74),"FUMO","densi e selvatici"]
  ];
  quads.forEach(([x,y,a,b])=>{
    const t=el("text",{class:"quad",x,y,"text-anchor":"middle"}); t.textContent=a;
    const s=el("text",{class:"quadsub",x,y:y+20,"text-anchor":"middle"}); s.textContent=b.toUpperCase();
    g.appendChild(t); g.appendChild(s);
  });
  g.appendChild(el("line",{class:"axis",x1:L-26,x2:L+S+26,y1:qy(0),y2:qy(0)}));
  g.appendChild(el("line",{class:"axis",x1:qx(0),x2:qx(0),y1:T-26,y2:T+S+26}));
  const poles=[
    [L-38,qy(0)-8,"end","AFFILATO","taglia, tende, disseta"],
    [L+S+38,qy(0)-8,"start","AVVOLGENTE","abbraccia, riempie, scalda"],
    [qx(0),T-42,"middle","NITIDO","lo capisci al primo sorso"],
    [qx(0),T+S+54,"middle","SELVATICO","ci devi entrare dentro"]
  ];
  poles.forEach(([x,y,an,a,b])=>{
    const t=el("text",{class:"pole",x,y,"text-anchor":an}); t.textContent=a;
    const s=el("text",{class:"polesub",x,y:y+15,"text-anchor":an}); s.textContent=b.toUpperCase();
    g.appendChild(t); g.appendChild(s);
  });
  planeSvg.appendChild(g);
}
const nodeLayer=el("g"); planeSvg.appendChild(nodeLayer);

/* de-collide identical coordinates */
const used=[];
VINI.forEach(v=>{
  let X=qx(v.x), Y=qy(v.y), tries=0;
  while(used.some(u=>Math.hypot(u[0]-X,u[1]-Y)<19) && tries<24){
    const a=tries*2.4; X=qx(v.x)+Math.cos(a)*(13+tries*1.4); Y=qy(v.y)+Math.sin(a)*(13+tries*1.4); tries++;
  }
  used.push([X,Y]); v._X=X; v._Y=Y;
});

const nodes={};
VINI.forEach(v=>{
  const col=TIPI[v.t].col;
  const g=el("g",{class:"node", tabindex:"0", role:"button", style:"color:"+col});
  g.setAttribute("aria-label", v.n);
  g.appendChild(el("circle",{class:"ring",cx:v._X,cy:v._Y,r:13,"stroke-width":1}));
  g.appendChild(el("circle",{class:"r",cx:v._X,cy:v._Y,r:7.5,fill:col}));
  const t=el("text",{x:v._X,y:v._Y-22,"text-anchor":"middle"}); t.textContent=v.sn||v.n;
  g.appendChild(t);
  const act=()=>{ state.sel=v.id; state.selProd=null; showWine(v.id); refresh(); };
  g.addEventListener("click",act);
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});
  nodeLayer.appendChild(g);
  nodes[v.id]={g, label:t};
});

/* label placement: four candidate positions, real measurement, hide on failure */
function placeLabels(){
  /* misurare il testo dentro un SVG nascosto non è affidabile: si rifà all'ingresso nella vista */
  if(state.view!=="plane") return;
  const shown=VINI.filter(visible);
  const boxes=shown.map(v=>[v._X-13,v._Y-13,26,26]);
  const hit=b=>boxes.some(o=>!(b[0]+b[2]<o[0]||b[0]>o[0]+o[2]||b[1]+b[3]<o[1]||b[1]>o[1]+o[3]));
  VINI.forEach(v=>{ if(!visible(v)) nodes[v.id].label.style.display="none"; });
  const order=shown.slice().sort((a,b)=>
    (state.sel===b.id)-(state.sel===a.id) || a._Y-b._Y || a._X-b._X);
  order.forEach(v=>{
    const t=nodes[v.id].label; t.style.display="";
    const w=t.getComputedTextLength()+5;
    const cands=[["middle",0,-22],["middle",0,31],["start",15,4],["end",-15,4]];
    let done=false;
    for(const c of cands){
      const x=v._X+c[1], y=v._Y+c[2];
      const bx = c[0]==="middle" ? x-w/2 : c[0]==="start" ? x : x-w;
      const b=[bx, y-11, w, 15];
      if(bx<6 || bx+w>1334) continue;
      if(!hit(b)){ t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("text-anchor",c[0]);
        boxes.push(b); done=true; break; }
    }
    if(!done){
      if(state.sel===v.id){ t.setAttribute("x",v._X); t.setAttribute("y",v._Y-22); t.setAttribute("text-anchor","middle"); }
      else t.style.display="none";
    }
  });
}

/* ---------- panel ---------- */
const panel=document.getElementById("panel"), pbody=document.getElementById("pbody");
document.getElementById("close").onclick=()=>{ panel.classList.remove("on"); state.sel=null; state.selProd=null; refresh(); };

function meter(leftLab,rightLab,val){
  return '<div class="meter"><div class="mrow"><span>'+leftLab+'</span><span>'+rightLab+'</span></div>'+
    '<div class="track"><u></u><i style="left:'+((val+1)/2*100)+'%"></i></div></div>';
}
function wineHTML(v){
  const P=PROD[v.pr], col=TIPI[v.t].col;
  const badge = v.nuovo===1 ? '<span class="badge">nuovo arrivo</span>'
              : v.nuovo===2 ? '<span class="badge">nuovo in carta</span>' : '';
  return '<div class="p-eyebrow"><span class="sw" style="background:'+col+'"></span>'+TIPI[v.t].label+
      ' · '+P.p+'</div>'+
    '<h2 class="p-name">'+v.n+badge+'</h2>'+
    '<p class="p-prod">'+P.n+'</p>'+
    '<div class="p-place">'+(P.c+" — "+P.r).toUpperCase()+'</div>'+
    '<p class="p-note">'+v.nota+'</p>'+
    '<dl class="specs">'+
      '<dt>Uve</dt><dd>'+v.uve+'</dd>'+
      '<dt>Annata</dt><dd>'+v.an+'</dd>'+
      '<dt>Alcol</dt><dd>'+v.vol+'</dd>'+
      '<dt>In cantina</dt><dd>'+v.lav+'</dd>'+
    '</dl>'+
    '<div class="meters">'+
      meter("Affilato","Avvolgente",v.x)+
      meter("Selvatico","Nitido",v.y)+
    '</div>'+
    '<div class="price"><span class="big">'+fmt(v.p)+'</span>'+
      (v.g?'<span class="glass">al bicchiere '+fmt(v.g)+'</span>':'')+
      '<span class="fmt">'+(v.fmt||"bottiglia 75 cl")+'</span></div>'+
    '<div class="sec">Chi lo fa</div>'+
    '<p class="p-desc">'+P.d+'</p>'+
    (VINI.filter(w=>w.pr===v.pr && w.id!==v.id && visible(w)).length
      ? '<div class="sec">Altre etichette di '+P.n+'</div>'+list(v.pr, v.id) : '');
}
function list(k, skip){
  return '<ul class="plist">'+VINI.filter(v=>v.pr===k && v.id!==skip && visible(v))
    .sort((a,b)=>a.p-b.p)
    .map(v=>'<li><button data-w="'+v.id+'">'+
      '<span class="sw" style="background:'+TIPI[v.t].col+'"></span>'+
      '<span class="nm">'+v.n+'</span><span class="pr">'+fmt(v.p)+'</span>'+
      '<span class="sub2">'+v.t+' · '+v.uve+' · '+v.vol+
        (v.g?' · al bicchiere '+fmt(v.g):'')+'</span>'+
      '</button></li>').join('')+'</ul>';
}
function wire(){
  pbody.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    state.sel=b.dataset.w; state.selProd=null; showWine(b.dataset.w); refresh(); });
  pbody.scrollTop=0; panel.classList.add("on");
}
function showWine(id){ pbody.innerHTML=wineHTML(byId[id]); wire(); }
function showProducer(k){
  const P=PROD[k], ws=VINI.filter(v=>v.pr===k && visible(v));
  /* un solo vino: la scheda del produttore sarebbe un passaggio a vuoto */
  if(ws.length===1){ state.sel=ws[0].id; state.selProd=null; showWine(ws[0].id); return; }
  const all=VINI.filter(v=>v.pr===k);
  const tipi=[...new Set(ws.map(v=>TIPI[v.t].label))];
  const prezzi=ws.map(v=>v.p), gl=ws.filter(v=>v.g).length;
  pbody.innerHTML='<div class="p-eyebrow">Produttore · '+P.p+'</div>'+
    '<h2 class="p-name">'+P.n+'</h2>'+
    '<div class="p-place">'+(P.c+" — "+P.r).toUpperCase()+'</div>'+
    '<p class="p-desc">'+P.d+'</p>'+
    '<div class="p-facts">'+
      '<span>'+all.length+' etichette</span>'+
      '<span>'+tipi.join(" · ")+'</span>'+
      '<span>da '+fmt(Math.min(...prezzi))+' a '+fmt(Math.max(...prezzi))+'</span>'+
      (gl?'<span>'+gl+' al bicchiere</span>':'')+
      (ws.length<all.length?'<span>'+(all.length-ws.length)+' nascoste dai filtri</span>':'')+
    '</div>'+
    '<div class="sec">Le etichette in carta</div>'+list(k,null);
  wire();
}

/* ---------- legend / hint ---------- */
const legendEl=document.getElementById("legend"), hintEl=document.getElementById("hint");
function renderLegend(){
  if(state.view==="map"){
    legendEl.innerHTML='<b>'+prodKeys.length+' produttori · '+VINI.length+' etichette</b>'+
      '<span>Il numero nel cerchio è quante etichette teniamo di quel produttore</span>';
    hintEl.textContent="Tocca un produttore · trascina per spostare · pizzica per zoomare";
  } else {
    legendEl.innerHTML='<b>Dove sta il vino, non come si chiama</b>'+
      '<span>Orizzontale: struttura in bocca · Verticale: quanto è immediato</span>';
    hintEl.textContent="Tocca un punto per la scheda";
  }
}

/* ---------- refresh ---------- */
function refresh(){
  prodKeys.forEach(k=>{
    const any=pins[k].wines.some(visible);
    pins[k].g.classList.toggle("dim", !any);
    pins[k].g.classList.toggle("sel", state.selProd===k);
    pins[k].g.style.pointerEvents = any ? "" : "none";
  });
  VINI.forEach(v=>{
    const nd=nodes[v.id], vis=visible(v);
    nd.g.classList.toggle("dim", !vis);
    nd.g.classList.toggle("sel", state.sel===v.id);
    nd.g.style.pointerEvents = vis ? "" : "none";
  });
  placeLabels();
  renderLegend();
}

/* ---------- view switch ---------- */
const btnMap=document.getElementById("btnMap"), btnPlane=document.getElementById("btnPlane");
function setView(v){
  state.view=v;
  btnMap.setAttribute("aria-pressed", String(v==="map"));
  btnPlane.setAttribute("aria-pressed", String(v==="plane"));
  mapSvg.classList.toggle("on", v==="map");
  planeSvg.classList.toggle("on", v==="plane");
  panel.classList.remove("on"); state.sel=null; state.selProd=null;
  refresh();
}
btnMap.onclick=()=>setView("map");
btnPlane.onclick=()=>setView("plane");

/* ---------- pan / zoom on the map ---------- */
(function(){
  const base={x:230,y:258,w:1140,h:730};
  let vb={...base};
  const apply=()=>mapSvg.setAttribute("viewBox",vb.x+" "+vb.y+" "+vb.w+" "+vb.h);
  const pts=new Map(); let last=null, moved=false, start=null;
  const toSvg=e=>{const r=mapSvg.getBoundingClientRect();
    return {x:vb.x+(e.clientX-r.left)/r.width*vb.w, y:vb.y+(e.clientY-r.top)/r.height*vb.h};};
  const clamp=()=>{
    vb.w=Math.max(base.w*0.28, Math.min(base.w*1.25, vb.w));
    vb.h=vb.w*base.h/base.w;
    vb.x=Math.max(base.x-320, Math.min(base.x+base.w+320-vb.w, vb.x));
    vb.y=Math.max(base.y-220, Math.min(base.y+base.h+220-vb.h, vb.y));
  };
  const held=new Set();
  const grab=id=>{ if(!held.has(id)){ try{ mapSvg.setPointerCapture(id); held.add(id); }catch(_){} } };
  mapSvg.addEventListener("pointerdown",e=>{
    /* niente pointer capture qui: catturare subito sposterebbe il click dal pin all'SVG
       e i pin non si aprirebbero mai. Si cattura solo quando parte un vero trascinamento. */
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    last=null; moved=false; start={x:e.clientX,y:e.clientY};
    if(pts.size===2) pts.forEach((_,id)=>grab(id));
  });
  mapSvg.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId)) return;
    const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=mapSvg.getBoundingClientRect();
    if(pts.size===1){
      const dx=(e.clientX-prev.x)/r.width*vb.w, dy=(e.clientY-prev.y)/r.height*vb.h;
      /* è un trascinamento solo oltre gli 8 px: sotto è un tap con la mano che trema */
      if(!moved && start && Math.hypot(e.clientX-start.x, e.clientY-start.y) > 8){ moved=true; grab(e.pointerId); }
      if(!moved) return;
      vb.x-=dx; vb.y-=dy; clamp(); apply();
    } else if(pts.size===2){
      moved=true; grab(e.pointerId);
      const [a,b]=[...pts.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(last){ const f=last/d; const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
        vb.w*=f; vb.h*=f; vb.x=cx-vb.w/2; vb.y=cy-vb.h/2; clamp(); apply(); }
      last=d;
    }
  });
  const up=e=>{
    pts.delete(e.pointerId);
    if(held.has(e.pointerId)){ try{ mapSvg.releasePointerCapture(e.pointerId); }catch(_){} held.delete(e.pointerId); }
    if(pts.size<2) last=null;
  };
  mapSvg.addEventListener("pointerup",up);
  mapSvg.addEventListener("pointercancel",up);
  mapSvg.addEventListener("wheel",e=>{
    e.preventDefault();
    const p=toSvg(e), f=e.deltaY>0?1.12:0.89, w0=vb.w;
    vb.w*=f; clamp();
    const k=vb.w/w0;
    vb.x=p.x-(p.x-vb.x)*k; vb.y=p.y-(p.y-vb.y)*k; clamp(); apply();
  },{passive:false});
  mapSvg.addEventListener("click",e=>{ if(moved){ e.stopPropagation(); moved=false; } },true);
})();

refresh();
</script>
